<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Своя политика: страницу отдаёт сервер напрямую, правила главной сюда не доходят -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — Meduk Relax</title>
    <link rel="icon" type="image/png" href="/assets/favicon-64.png" />
    <style>
      /* Отдельные лёгкие стили: тянуть сюда весь файл оформления ради одной
         страницы не имеет смысла, а системный шрифт грузится мгновенно */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #efe6d0;
        color: #2b2214;
        font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .wrap { max-width: 440px; }
      img { width: 96px; height: 96px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; }
      p { margin: 0 0 28px; color: #63563e; }
      a.back {
        display: inline-block;
        padding: 13px 26px;
        min-height: 44px;
        border-radius: 999px;
        background: linear-gradient(135deg, #d8ad5c, #b8863a);
        color: #1b1408;
        font-weight: 700;
        text-decoration: none;
      }
      a.back:hover { filter: brightness(1.06); }
      @media (prefers-color-scheme: dark) {
        body { background: #050505; color: #efe6d0; }
        p { color: #9a8f7a; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/assets/mark-88.webp" alt="" width="96" height="96" />
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Звуковая комната на месте — вернись на главную.</p>
      <a class="back" href="/">На главную</a>
    </div>
  </body>
</html>
